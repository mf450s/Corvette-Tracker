name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install uv && uv sync --locked
      - name: Test
        run: uv run pytest -q
