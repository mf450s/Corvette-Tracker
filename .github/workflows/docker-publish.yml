name: CI and Docker Publish

on:
  push:
    branches: [development, main]
    tags: ['v*']
  pull_request:
    branches: [development]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mf450s/corvette-tracker
  IMAGE: local/corvette-tracker:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: install
        run: pip install uv && uv sync --locked
      - name: quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uvx --from ty==0.0.78 ty check src
          uv run pytest -q

  build-scan:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: move Docker layer cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      # Forgejo prefetches every referenced external action before evaluating step conditions.
      # Run the scanners as pinned Docker images so missing GitHub Marketplace mirrors do not fail Forgejo.
      - name: trivy image scan
        if: ${{ github.repository_owner == 'mf450s' }}
        run: |
          if [ "${GITHUB_API_URL:-}" != "https://api.github.com" ]; then
            printf '%s\n' 'Forgejo skip: Trivy image scan is replaced by the GitHub-only security path.'
            exit 0
          fi
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock --volume "$PWD:/src" aquasec/trivy:0.71.2 image --format sarif --output /src/trivy-image.sarif --severity HIGH,CRITICAL --ignore-unfixed --vuln-type os,library "${IMAGE}"

      - name: trivy config scan
        if: ${{ github.repository_owner == 'mf450s' }}
        run: |
          if [ "${GITHUB_API_URL:-}" != "https://api.github.com" ]; then
            printf '%s\n' 'Forgejo skip: Trivy config scan is replaced by the GitHub-only security path.'
            exit 0
          fi
          docker run --rm --volume "$PWD:/src" aquasec/trivy:0.71.2 config --format sarif --output /src/trivy-config.sarif --severity HIGH,CRITICAL /src

      - name: trivy secret scan
        if: ${{ github.repository_owner == 'mf450s' }}
        run: |
          if [ "${GITHUB_API_URL:-}" != "https://api.github.com" ]; then
            printf '%s\n' 'Forgejo skip: Trivy secret scan is replaced by the GitHub-only security path.'
            exit 0
          fi
          docker run --rm --volume "$PWD:/src" aquasec/trivy:0.71.2 fs --scanners secret --format sarif --output /src/trivy-secret.sarif /src

      - name: grype image scan
        if: ${{ github.repository_owner == 'mf450s' }}
        run: |
          if [ "${GITHUB_API_URL:-}" != "https://api.github.com" ]; then
            printf '%s\n' 'Forgejo skip: Grype image scan is replaced by the GitHub-only security path.'
            exit 0
          fi
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock --volume "$PWD:/src" anchore/grype:v0.115.0 "${IMAGE}" --only-fixed --output sarif=/src/grype.sarif

      - name: upload SARIF results to GitHub code scanning
        if: ${{ always() && github.repository_owner == 'mf450s' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_API_URL:-}" != "https://api.github.com" ]; then
            printf '%s\n' 'Forgejo skip: SARIF upload is only available through the GitHub Code Scanning API.'
            exit 0
          fi
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import os
          import urllib.request
          from pathlib import Path

          api = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"] + "/code-scanning/sarifs"
          for filename, tool_name in (("trivy-image.sarif", "trivy-image"), ("trivy-config.sarif", "trivy-config"), ("trivy-secret.sarif", "trivy-secret"), ("grype.sarif", "grype-image")):
              report = Path(filename)
              if not report.is_file():
                  print("SARIF report missing: " + filename)
                  continue
              payload = {
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "ref": os.environ["GITHUB_REF"],
                  "sarif": base64.b64encode(gzip.compress(report.read_bytes())).decode("ascii"),
                  "tool_name": tool_name,
              }
              request = urllib.request.Request(api, data=json.dumps(payload).encode("utf-8"), method="POST", headers={"Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["GH_TOKEN"], "Content-Type": "application/json", "User-Agent": "corvette-tracker-ci/1"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  print("SARIF upload " + tool_name + ": HTTP " + str(response.status))
          PY

      - name: explain Forgejo security scan skips
        if: ${{ always() && github.repository_owner != 'mf450s' }}
        run: |
          printf '%s\n' 'Forgejo skip: Trivy and Grype run only on the GitHub canonical because this Forgejo instance does not mirror their external action repositories.'
          printf '%s\n' 'Forgejo skip: GitHub Code Scanning SARIF upload is replaced by the GitHub API path and is unavailable on Forgejo.'

      - name: smoke test image
        shell: bash
        run: |
          set -euo pipefail
          container=corvette-tracker-security
          docker run --detach --name "$container" --env CORVETTE_TRACKER_RUN_ON_START=false --publish 127.0.0.1:18096:8096 "${IMAGE}"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18096/api/status >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18096/api/status >/dev/null
          for _ in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy

  publish:
    if: ${{ github.event_name == 'push' && github.repository_owner == 'mf450s' }}
    needs: [test, build-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: build image for publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: move Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      - name: login to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner == 'mf450s' && github.actor || secrets.GHCR_USERNAME }}
          password: ${{ github.repository_owner == 'mf450s' && secrets.GITHUB_TOKEN || secrets.GHCR_TOKEN }}

      - name: extract docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: publish image tags
        env:
          local_image: ${{ env.IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$local_image" "$tag"
            docker push "$tag"
          done <<< "$tags"
