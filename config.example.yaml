sources:
  autoscout24:
    enabled: true
    url: "https://www.autoscout24.de/lst?cat=ma16380mo19141%2Cma16380mo19140%2Cma16380mo20782%2Cma16380mo75462%2Cma16380mo21061%2Cma16380mo74838%2Cma16380mo19142%2Cma16380mo19143&cy=D&damaged_listing=exclude&desc=0&ocs_listing=include&powertype=kw&sort=standard&ustate=N%2CU&atype=C&search_id=nfg3gad0ed&source=homepage_search-mask"
    urls:
      - "https://www.autoscout24.de/lst?cat=ma16380mo19141%2Cma16380mo19140%2Cma16380mo20782%2Cma16380mo75462%2Cma16380mo21061%2Cma16380mo74838%2Cma16380mo19142%2Cma16380mo19143&cy=D&damaged_listing=exclude&desc=0&ocs_listing=include&powertype=kw&sort=standard&ustate=N%2CU&atype=C&search_id=nfg3gad0ed&source=homepage_search-mask"
  kleinanzeigen:
    enabled: true
    url: "https://www.kleinanzeigen.de/s-autos/sortierung:neuste/corvette-c6/k0c216"
    urls:
      - "https://www.kleinanzeigen.de/s-autos/sortierung:neuste/corvette-c6/k0c216"
  autouncle:
    enabled: true # can intermittently return HTTP 403; connector reports it as warning.
    url: "https://www.autouncle.de/de/gebrauchtwagen/Chevrolet/Corvette"
    urls:
      - "https://www.autouncle.de/de/gebrauchtwagen/Chevrolet/Corvette"
      - "https://www.autouncle.de/de/gebrauchtwagen/Chevrolet/Corvette?freetext=C6"
  classic_trader:
    enabled: true # currently often returns 0 C6 offers, but source is parsed when listings exist.
    url: "https://www.classic-trader.com/de/automobile/suche/chevrolet/corvette"
    urls:
      - "https://www.classic-trader.com/de/automobile/suche/chevrolet/corvette"
      - "https://www.classic-trader.com/de/automobile/suche/chevrolet/corvette/c6"
  mobile_de:
    enabled: true # may return access denied from some server/IP ranges; connector reports it as warning.
    url: "https://suchen.mobile.de/fahrzeuge/search.html?dam=false&fr=2005%3A2013&isSearchRequest=true&ms=5600%3B36%3B%3B&ref=quickSearch&s=Car&sb=rel&vc=Car"
output_dir: "."
database_path: "data/corvette_tracker.sqlite"

ai_enrichment:
  enabled: false
  # Optional: dotted provider path loaded as `module:ClassName`.
  # The class must implement analyze_listing(EnrichmentInput) -> EnrichmentResult.
  # Example after copying/adapting examples/ai_provider_template.py:
  # provider: "examples.ai_provider_template:ExampleVisionProvider"
  provider: null
  max_images: 8

quality:
  enabled: true
  # Live crawls below these numbers are treated as suspicious and return exit code 3.
  min_total: 10
  min_by_source:
    AutoScout24: 5
    Kleinanzeigen: 10

scoring:
  # Score = base_score + matching preference weights - risk penalties, capped to 0..100.
  # Current preference: Schalter sehr wichtig; kein Cabrio und kein LS2 wichtig; Trim mittel.
  base_score: 20
  weights:
    manual_transmission: 30
    non_convertible: 20
    non_ls2: 20
    preferred_trim: 10
  preferred_trims:
    - Grand Sport
    - Z06
    - ZR1
  risk_penalties:
    accident_reported: 18
    damage_reported: 14
    salvage_import_possible: 10
    mileage_unclear: 8
    no_tuv: 8
    modified_heavily: 4
    sold_or_reserved: 20
